name: Feature request
description: Suggest a focused improvement to StormPad
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples or screenshots if they help explain the request.
